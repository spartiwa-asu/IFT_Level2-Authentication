<rect x="442" y="159" width="16" height="76" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="442" y="413" width="16" height="168" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="442" y="643" width="16" height="76" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="442" y="781" width="16" height="134" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="610" y="205" width="16" height="192" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="610" y="689" width="16" height="76" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="778" y="367" width="16" height="76" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="778" y="505" width="16" height="30" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<rect x="778" y="735" width="16" height="30" fill="#5fb3b3" stroke="#3d8f8f" stroke-width="1"/>
<line x1="122.0" y1="128" x2="274.0" y2="128" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="198.0" y="121" text-anchor="middle" font-size="12" fill="#1c1917">1. signup(), enter name, email, password</text>
<line x1="290.0" y1="174" x2="442.0" y2="174" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="366.0" y="167" text-anchor="middle" font-size="12" fill="#1c1917">2. POST /api/v1/users/signup</text>
<line x1="458.0" y1="220" x2="610.0" y2="220" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="534.0" y="213" text-anchor="middle" font-size="12" fill="#1c1917">3. User.create({ name, email, password })</text>
<path d="M 626.0 256 H 668.0 V 280 H 628.0" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="676.0" y="264" font-size="12" fill="#1c1917">4. validate: email, password length, confirmation</text>
<path d="M 626.0 314 H 668.0 V 338 H 628.0" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="676.0" y="322" font-size="12" fill="#1c1917">5. pre-save: bcrypt.hash(password, 12)</text>
<line x1="626.0" y1="382" x2="778.0" y2="382" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="702.0" y="375" text-anchor="middle" font-size="12" fill="#1c1917">6. insert into users (unique index on email)</text>
<line x1="778.0" y1="428" x2="458.0" y2="428" stroke="#a33121" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-fail)"/>
<text x="618.0" y="421" text-anchor="middle" font-size="12" fill="#a33121">7. duplicate email -&gt; error 11000</text>
<line x1="442.0" y1="474" x2="122.0" y2="474" stroke="#a33121" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-fail)"/>
<text x="282.0" y="467" text-anchor="middle" font-size="12" fill="#a33121">8. 409 Conflict, registration failed</text>
<line x1="778.0" y1="520" x2="458.0" y2="520" stroke="#2f6f4e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
<text x="618.0" y="513" text-anchor="middle" font-size="12" fill="#2f6f4e">9. document written</text>
<line x1="442.0" y1="566" x2="122.0" y2="566" stroke="#2f6f4e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
<text x="282.0" y="559" text-anchor="middle" font-size="12" fill="#2f6f4e">10. 201 Created, registration succeeded</text>
<line x1="122.0" y1="612" x2="274.0" y2="612" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="198.0" y="605" text-anchor="middle" font-size="12" fill="#1c1917">11. login(), enter email and password</text>
<line x1="290.0" y1="658" x2="442.0" y2="658" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="366.0" y="651" text-anchor="middle" font-size="12" fill="#1c1917">12. POST /api/v1/users/login</text>
<line x1="458.0" y1="704" x2="610.0" y2="704" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="534.0" y="697" text-anchor="middle" font-size="12" fill="#1c1917">13. User.findOne({ email }).select(&#x27;+password&#x27;)</text>
<line x1="626.0" y1="750" x2="778.0" y2="750" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="702.0" y="743" text-anchor="middle" font-size="12" fill="#1c1917">14. read the users collection</text>
<path d="M 458.0 786 H 500.0 V 810 H 460.0" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="508.0" y="794" font-size="12" fill="#1c1917">15. bcrypt.compare(typed, stored hash)</text>
<line x1="442.0" y1="854" x2="122.0" y2="854" stroke="#a33121" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-fail)"/>
<text x="282.0" y="847" text-anchor="middle" font-size="12" fill="#a33121">16. 401, incorrect email or password</text>
<line x1="442.0" y1="900" x2="122.0" y2="900" stroke="#2f6f4e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-ok)"/>
<text x="282.0" y="893" text-anchor="middle" font-size="12" fill="#2f6f4e">17. 200 OK - and nothing else. No cookie, no token.</text>
<text x="30" y="1010" font-size="11.5" fill="#57534e" font-style="italic">The next request from this player is anonymous again: nothing was issued to send back.</text>
<text x="30" y="1034" font-size="11" fill="#8a8279">IFT 458 Game Score Tracker - Level 1. Dotted arrows are responses. Red arrows are failures.</text>
</svg>